# Met à jour automatiquement la branche "upm", qui contient uniquement le package à sa racine.
# - À chaque push sur main : la branche upm reçoit la dernière version du package.
# - À chaque tag vX.Y.Z : un tag upm/vX.Y.Z est créé sur la branche upm (pour installer une version précise).
name: Branche upm

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  upm:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt (avec tout l'historique)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraire le dossier du package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SPLIT=$(git subtree split --prefix=com.niangahmed821.hackatonpackagepluginmln HEAD)
          echo "SPLIT=$SPLIT" >> "$GITHUB_ENV"

      - name: Mettre à jour la branche upm
        if: github.ref_type == 'branch'
        run: git push origin "$SPLIT:refs/heads/upm"

      - name: Créer le tag upm/vX.Y.Z
        if: github.ref_type == 'tag'
        run: |
          git tag -a "upm/${GITHUB_REF_NAME}" "$SPLIT" -m "Version ${GITHUB_REF_NAME#v} (branche upm)"
          git push origin "refs/tags/upm/${GITHUB_REF_NAME}"
